[package]
name = "xiangqi"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.10" }

[target.'cfg(target_os = "android")'.dependencies]
manganis = "=0.7.10"
tokio = { version = "1", features = ["time"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.android-dev]
inherits = "dev"

[profile.release]
lto = "thin"
codegen-units = 1
